name: Validate Dongle Link
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r dongle_link/requirements.txt pytest ruff playwright
      - run: ruff check .
      - run: pytest -q
      - run: playwright install --with-deps chromium
      - name: Browser tests with synthetic modems
        run: |
          mkdir -p /tmp/modemhub-ci
          echo '{"import_existing":false}' > /tmp/modemhub-ci/options.json
          cd dongle_link
          DONGLE_LINK_DEV=1 DONGLE_LINK_DATA=/tmp/modemhub-ci DONGLE_LINK_PORT=8108 python -m app.server &
          cd ..
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8108/ >/dev/null && break
            sleep 1
          done
          python tests/browser_checks.py
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: dongle_link
          platforms: ${{ matrix.platform }}
          push: false
