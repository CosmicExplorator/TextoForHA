name: TextoForHA
version: 0.1.0
slug: textoforha
description: "Gère les SMS et le réseau de tes modems Huawei HiLink et AT depuis Home Assistant."
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:router-wireless
panel_title: TextoForHA
homeassistant_api: true
uart: true
udev: true
options:
  poll_interval: 60
  import_existing: true
schema:
  poll_interval: int(15,300)
  import_existing: bool
